<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>현실 속 작은 무대 — AR</title>
<script type="module" src="https://unpkg.com/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#151821;color:#fff;font-family:system-ui,sans-serif}model-viewer{display:block;width:100%;height:100vh;height:100dvh;background:radial-gradient(ellipse at center,#333c50,#151821)}header{position:fixed;top:max(24px,env(safe-area-inset-top));left:24px;right:24px;pointer-events:none}h1{font-size:26px;margin:0 0 10px}p{line-height:1.6;margin:0;color:#cbd2df}footer{position:fixed;bottom:max(28px,env(safe-area-inset-bottom));left:20px;right:20px;text-align:center}button{border:0;border-radius:14px;padding:16px 26px;background:#ffd18a;color:#171717;font-size:17px;font-weight:700;cursor:pointer}button:disabled{opacity:.5;cursor:default}#status{font-size:14px;margin:12px auto;max-width:480px}#platform{font-size:12px;margin-top:8px}
</style>
</head>
<body>
<!-- 아래 JavaScript의 MODEL에 동일한 작품의 GLB / USDZ를 지정합니다. -->
<model-viewer id="viewer" alt="현실 공간에 배치할 3D 모델" ar ar-placement="floor" ar-scale="auto" camera-controls touch-action="pan-y" shadow-intensity="1" loading="eager" reveal="auto">
  <!-- 기본 AR 버튼 대신 아래의 공통 버튼으로 실행합니다. -->
  <span slot="ar-button" hidden></span>
</model-viewer>
<header><h1>현실 속 작은 무대</h1><p>AR로 배치하고, 손가락으로 옮기거나<br>두 손가락으로 크기를 조절하세요.</p></header>
<footer>
<p id="status" role="status" aria-live="polite">모델을 불러오는 중입니다.</p>
<button id="start" type="button" disabled>AR 준비 중</button>
<p id="platform"></p>
</footer>
<script type="module">
// 샘플로 먼저 테스트하세요. 실제 작품 제작 후 두 경로만 바꾸면 됩니다.
const MODEL = {
  glb: 'https://modelviewer.dev/shared-assets/models/Astronaut.glb',
  usdz: 'https://modelviewer.dev/shared-assets/models/Astronaut.usdz'
  // glb: './models/stage.glb',
  // usdz: './models/stage.usdz'
};
const viewer = document.querySelector('#viewer');
const start = document.querySelector('#start');
const status = document.querySelector('#status');
const platform = document.querySelector('#platform');
const ua = navigator.userAgent;
const isIOS = /iPad|iPhone|iPod/.test(ua) ||
  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isAndroid = /Android/i.test(ua);
let loaded = false;
let launching = false;

// 사용자 에이전트는 실행 경로 선택에만 사용합니다.
// 실제 실행 가능 여부는 model-viewer의 canActivateAR로 확인합니다.
viewer.setAttribute('ar-modes', isIOS ? 'quick-look' :
  isAndroid ? 'webxr scene-viewer' : 'webxr');
viewer.setAttribute('ios-src', MODEL.usdz);
platform.textContent = isIOS ? 'iPhone / iPad · Quick Look' :
  isAndroid ? 'Android · WebXR 우선 / Scene Viewer 대체' :
  '컴퓨터에서는 미리보기 · AR 지원 휴대전화로 접속하세요';

function updateButton() {
  const supported = loaded && viewer.canActivateAR;
  start.disabled = !supported || launching;
  start.textContent = launching ? 'AR 실행 중…' :
    supported ? '현실 공간에 배치하기' : 'AR 실행 불가';
}

viewer.addEventListener('load', () => {
  loaded = true;
  updateButton();
  status.textContent = viewer.canActivateAR
    ? '준비 완료. AR을 시작한 뒤 밝은 바닥이나 책상을 비춰 주세요.'
    : '이 환경에서 AR을 실행할 수 없습니다. 지원 휴대전화의 Safari 또는 Chrome으로 열어 주세요.';
});
viewer.addEventListener('error', () => {
  loaded = false;
  updateButton();
  status.textContent = '모델 로딩 실패. 인터넷 연결과 모델 파일 주소를 확인해 주세요.';
});
viewer.addEventListener('ar-status', ({ detail }) => {
  if (detail.status === 'failed') {
    status.textContent = 'AR 실행 실패. 카메라 권한과 기기 지원 여부를 확인해 주세요.';
  } else if (detail.status === 'object-placed') {
    status.textContent = '배치 완료. 드래그로 이동하고 핀치로 크기를 바꾸세요.';
  }
});
start.addEventListener('click', async () => {
  if (launching || !loaded || !viewer.canActivateAR) return;
  launching = true;
  updateButton();
  try {
    // 버튼 클릭 안에서 직접 실행해 브라우저의 사용자 동작 조건을 충족합니다.
    await viewer.activateAR();
  } catch (error) {
    status.textContent = 'AR을 시작하지 못했습니다. 권한을 확인한 뒤 다시 시도해 주세요.';
    console.error(error);
  } finally {
    launching = false;
    updateButton();
  }
});
viewer.setAttribute('src', MODEL.glb);

// 라이브러리를 불러오지 못했거나 네트워크가 느린 경우 안내합니다.
setTimeout(() => {
  if (!customElements.get('model-viewer')) {
    status.textContent = 'AR 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침해 주세요.';
  } else if (!loaded) {
    status.textContent = '모델 로딩이 지연되고 있습니다. 인터넷 연결을 확인해 주세요.';
  }
}, 20000);
</script>
</body>
</html>
