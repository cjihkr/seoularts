<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171917"><title>같은 곳에, 따로 | 시점이 바꾸는 진실</title>
<script type="module" src="https://unpkg.com/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#171917;color:#f2efe7;font-family:system-ui,'Apple SD Gothic Neo',sans-serif}main{position:relative;height:100vh;height:100dvh;min-height:600px;overflow:hidden}model-viewer{position:absolute;inset:0;width:100%;height:100%;background:radial-gradient(ellipse at 50% 47%,#3c403b 0,#171917 70%)}header{position:absolute;top:max(28px,env(safe-area-inset-top));left:7%;pointer-events:none}header small{color:#c1b58e;letter-spacing:.18em;font-size:11px}h1{font-size:clamp(30px,6vw,56px);letter-spacing:-.06em;margin:12px 0}header p{color:#c8cbc3;font-size:14px;line-height:1.7;margin:0}.bottom{position:absolute;bottom:max(24px,env(safe-area-inset-bottom));left:7%;right:7%;display:flex;flex-direction:column;align-items:center;gap:12px}nav{display:flex;gap:8px}button{cursor:pointer;font:inherit;color:inherit;border:1px solid #72786c;background:#20251f;border-radius:999px;padding:10px 17px}button:focus-visible{outline:3px solid #f1cf84;outline-offset:3px}button[aria-pressed=true]{background:#f2efe7;color:#171917;border-color:#f2efe7}#start{background:#e0c28a;border:0;color:#171917;font-size:16px;font-weight:700;padding:17px 30px;min-width:260px}button:disabled{opacity:.5;cursor:default}#status{font-size:13px;color:#d1d5cd;text-align:center;line-height:1.5;max-width:540px;margin:0}#route{font-size:11px;color:#aeb7a7;margin:0}#caption{position:absolute;top:29%;left:7%;font-size:13px;color:#dbc595;pointer-events:none}.tag{position:absolute;top:32px;right:7%;font-size:11px;color:#b9c2b4;writing-mode:vertical-rl;letter-spacing:.2em}@media(min-width:800px){header{top:48px}#caption{top:30%}.bottom{bottom:32px}}
</style>
</head><body><main>
<model-viewer id="viewer" alt="같은 방향을 바라보는 두 인물과 그 사이를 나누는 칸막이로 이루어진 소형 무대" ar ar-scale="auto" ar-placement="floor" camera-controls touch-action="pan-y" camera-orbit="0deg 82deg 1.3m" camera-target="0m 0.13m 0m" field-of-view="32deg" min-camera-orbit="auto 20deg 0.65m" max-camera-orbit="auto 90deg 2.5m" shadow-intensity="1" exposure="1" loading="eager" interaction-prompt="none"><span slot="ar-button" hidden></span></model-viewer>
<header><small>시점이 바꾸는 진실 / AR 무대 실험 01</small><h1>같은 곳에, 따로</h1><p>함께 있다는 것은,<br>같은 공간에 있다는 뜻일까?</p></header><div class="tag">DIRECTING × CODE</div>
<p id="caption">01 — 함께 기다리는 두 사람</p>
<section class="bottom" aria-label="무대 조작">
<nav aria-label="웹 미리보기 시점"><button id="front" aria-pressed="true">01 정면</button><button id="side" aria-pressed="false">02 옆으로</button></nav>
<p id="status" role="status" aria-live="polite">작은 무대를 불러오는 중입니다.</p>
<button id="start" disabled>AR 준비 중</button><p id="route">미리보기는 드래그 · AR은 지원 휴대전화에서</p>
</section></main>
<script type="module">
const viewer=document.querySelector('#viewer'),start=document.querySelector('#start'),status=document.querySelector('#status'),route=document.querySelector('#route');
const ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const android=/Android/i.test(navigator.userAgent);let loaded=false,busy=false,failed=false;
viewer.setAttribute('ar-modes',ios?'quick-look':android?'webxr scene-viewer':'webxr');
viewer.setAttribute('ios-src','./models/stage.usdz');
route.textContent=ios?'iPhone / iPad · Quick Look':android?'Android · WebXR / Scene Viewer':'컴퓨터: 3D 미리보기 · AR은 지원 휴대전화에서';
function refresh(){const ok=loaded&&viewer.canActivateAR;start.disabled=!ok||busy;start.textContent=busy?'AR 여는 중…':ok?'현실 공간에 무대 놓기':'AR 실행 불가';}
viewer.addEventListener('load',()=>{loaded=true;refresh();status.textContent=viewer.canActivateAR?'준비 완료 · 바닥에 배치한 뒤, 카메라를 옆으로 움직여 보세요.':'정면과 측면을 비교해 보세요. AR은 지원 휴대전화에서 실행하세요.';});
viewer.addEventListener('error',()=>{failed=true;loaded=false;refresh();status.textContent='무대를 불러오지 못했습니다. models 폴더와 인터넷 연결을 확인하세요.';});
viewer.addEventListener('ar-status',({detail})=>{if(detail.status==='failed')status.textContent='AR 실행 실패. 기기 지원 여부와 카메라 권한을 확인하세요.';});
start.addEventListener('click',async()=>{if(!loaded||busy||!viewer.canActivateAR)return;busy=true;refresh();try{await viewer.activateAR();}catch(e){status.textContent='AR을 시작하지 못했습니다. 권한을 확인하고 다시 시도하세요.';console.error(e);}finally{busy=false;refresh();}});
function view(side){viewer.cameraOrbit=side?'65deg 78deg 1.3m':'0deg 82deg 1.3m';document.querySelector('#front').setAttribute('aria-pressed',String(!side));document.querySelector('#side').setAttribute('aria-pressed',String(side));document.querySelector('#caption').textContent=side?'02 — 함께인 줄 알았던, 분리된 공간':'01 — 함께 기다리는 두 사람';}
document.querySelector('#front').onclick=()=>view(false);document.querySelector('#side').onclick=()=>view(true);
viewer.addEventListener('camera-change',e=>{if(e.detail.source==='user-interaction'){document.querySelector('#front').setAttribute('aria-pressed','false');document.querySelector('#side').setAttribute('aria-pressed','false');document.querySelector('#caption').textContent='관객의 위치가 장면의 의미를 바꿉니다.';}});
viewer.setAttribute('src','./models/stage.glb');
setTimeout(()=>{if(!loaded&&!failed)status.textContent=customElements.get('model-viewer')?'로딩이 지연되고 있습니다. 연결 상태를 확인하세요.':'3D 라이브러리 로딩 실패. 인터넷 연결 후 새로고침하세요.';},20000);
</script></body></html>
