<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>손안의 무대</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      overflow: hidden;
      background: #111;
      color: white;
      font-family: sans-serif;
    }

    video, canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    video { object-fit: cover; }
    canvas { pointer-events: none; }

    #caption {
      position: fixed;
      left: 20px;
      right: 20px;
      bottom: max(32px, env(safe-area-inset-bottom));
      text-align: center;
      pointer-events: none;
      text-shadow: 0 2px 10px #000;
    }

    h1 { margin: 0 0 8px; font-size: 28px; }
    p { margin: 0; font-size: 14px; }

    #status {
      position: fixed;
      top: 20px;
      left: 20px;
      right: 20px;
      padding: 12px;
      border-radius: 10px;
      background: #000b;
      text-align: center;
    }

    #retry {
      margin-top: 10px;
      padding: 10px 16px;
      border: 0;
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <video id="camera" autoplay muted playsinline></video>

  <div id="caption">
    <h1 id="title">만남</h1>
    <p>화면을 터치하면 관계가 바뀝니다.</p>
  </div>

  <div id="status" role="status">
    <span id="message">카메라를 준비하고 있습니다.</span>
    <br>
    <button id="retry" hidden>카메라 다시 시작</button>
  </div>

  <script type="module">
    import * as THREE from
      "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js";

    const video = document.querySelector("#camera");
    const status = document.querySelector("#status");
    const message = document.querySelector("#message");
    const retry = document.querySelector("#retry");

    // 카메라 영상 위에 투명한 3D 화면을 겹칩니다.
    const renderer = new THREE.WebGLRenderer({
      alpha: true,
      antialias: true
    });

    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 0);
    document.body.prepend(renderer.domElement);
    renderer.domElement.style.zIndex = "1";
    document.querySelector("#caption").style.zIndex = "2";
    status.style.zIndex = "3";

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);

    const stage = new THREE.Group();
    scene.add(stage);

    // 무대
    const floor = new THREE.Mesh(
      new THREE.BoxGeometry(3.4, 0.12, 2.2),
      new THREE.MeshStandardMaterial({
        color: 0x343444,
        roughness: 0.85
      })
    );
    floor.position.y = -0.06;
    stage.add(floor);

    // 단순한 사람 모양의 배우
    function makeActor(color) {
      const actor = new THREE.Group();
      const material = new THREE.MeshStandardMaterial({ color });

      const body = new THREE.Mesh(
        new THREE.CylinderGeometry(0.12, 0.18, 0.6, 20),
        material
      );
      body.position.y = 0.3;

      const head = new THREE.Mesh(
        new THREE.SphereGeometry(0.14, 20, 16),
        material
      );
      head.position.y = 0.76;

      actor.add(body, head);
      stage.add(actor);
      return actor;
    }

    const actorA = makeActor(0xffe6c9);
    const actorB = makeActor(0xc2dbff);
    actorA.position.x = -0.35;
    actorB.position.x = 0.35;

    scene.add(new THREE.AmbientLight(0xffffff, 0.8));

    const light = new THREE.PointLight(0xffcc88, 30);
    light.position.set(0, 3, 2);
    scene.add(light);

    // タップごとに、距離・奥行き・光を変更
    let separated = false;
    let ready = false;
    const targetColor = new THREE.Color(0xffcc88);

    document.body.addEventListener("click", (event) => {
      if (!ready || event.target.closest("button")) return;

      separated = !separated;
      targetColor.set(separated ? 0x729dff : 0xffcc88);

      document.querySelector("#title").textContent =
        separated ? "断絶".replace("断絶", "단절") : "만남";
    });

    function resize() {
      const aspect = innerWidth / innerHeight;
      renderer.setSize(innerWidth, innerHeight);
      camera.aspect = aspect;

      // 세로 화면에서도 무대 전체가 보이도록 거리 조절
      const distance = Math.max(5.8, 3 / aspect);
      camera.position.set(0, distance * 0.6, distance);
      camera.lookAt(0, 0.2, 0);
      camera.updateProjectionMatrix();
    }

    addEventListener("resize", resize);
    resize();

    const clock = new THREE.Clock();

    renderer.setAnimationLoop(() => {
      const delta = Math.min(clock.getDelta(), 0.1);
      const blend = 1 - Math.exp(-4 * delta);
      const distance = separated ? 1.15 : 0.35;
      const depth = separated ? 0.4 : 0;

      actorA.position.x = THREE.MathUtils.lerp(
        actorA.position.x, -distance, blend
      );
      actorB.position.x = THREE.MathUtils.lerp(
        actorB.position.x, distance, blend
      );
      actorA.position.z = THREE.MathUtils.lerp(
        actorA.position.z, depth, blend
      );
      actorB.position.z = THREE.MathUtils.lerp(
        actorB.position.z, -depth, blend
      );

      light.color.lerp(targetColor, blend);
      renderer.render(scene, camera);
    });

    // 시작 버튼 없이 카메라 권한을 바로 요청합니다.
    async function startCamera() {
      retry.hidden = true;

      if (!navigator.mediaDevices?.getUserMedia) {
        message.textContent =
          "HTTPS 주소를 Safari 또는 Chrome으로 열어 주세요.";
        return;
      }

      try {
        message.textContent = "카메라 접근을 허용해 주세요.";

        if (!video.srcObject) {
          video.srcObject =
            await navigator.mediaDevices.getUserMedia({
              audio: false,
              video: {
                facingMode: { ideal: "environment" },
                width: { ideal: 1280 },
                height: { ideal: 720 }
              }
            });
        }

        await video.play();
        ready = true;
        status.hidden = true;
      } catch (error) {
        message.textContent =
          "카메라를 시작하지 못했습니다. 권한을 확인한 뒤 다시 눌러 주세요.";
        retry.hidden = false;
      }
    }

    retry.addEventListener("click", startCamera);
    startCamera();
  </script>
</body>
</html>
